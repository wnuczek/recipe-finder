name: Deploy API To Cloudflare On Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-api-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit belongs to master
        run: |
          git fetch origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag commit is on master history."
            echo "SHOULD_DEPLOY=true" >> "$GITHUB_ENV"
          else
            echo "Tag commit is not on master. Deployment will be skipped."
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        if: env.SHOULD_DEPLOY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: env.SHOULD_DEPLOY == 'true'
        run: npm ci

      - name: Deploy API Worker
        if: env.SHOULD_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.api.toml
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
